<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña | Dataholics Resolve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700" 
         x-data="resetPasswordHandler()">
        
        <div class="p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">Crear Nueva Contraseña</h1>
                <p class="text-slate-400 text-sm">Tu nueva contraseña debe tener al menos 8 caracteres.</p>
            </div>

            <!-- Error fatal (sin token) -->
            <div x-show="fatalError" x-cloak class="text-center space-y-4">
                <div class="p-4 bg-red-500/10 border border-red-500/30 rounded-xl">
                    <p class="text-red-400 text-sm font-medium">Enlace inválido o expirado.</p>
                </div>
                <a href="/forgot-password.html" class="inline-block text-blue-400 text-sm hover:text-blue-300">Solicitar nuevo enlace</a>
            </div>

            <!-- Form state -->
            <form x-show="!fatalError && !successMessage" @submit.prevent="submitForm" x-cloak>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Nueva Contraseña</label>
                        <input type="password" x-model="password" required minlength="8"
                               class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none"
                               placeholder="Mínimo 8 caracteres">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Confirmar Contraseña</label>
                        <input type="password" x-model="confirmPassword" required minlength="8"
                               class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none"
                               placeholder="Repite la contraseña">
                    </div>

                    <div x-show="errorMessage" x-transition
                         class="p-3 bg-red-500/10 border border-red-500/50 rounded-lg text-red-400 text-sm flex items-start gap-2">
                         <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span x-text="errorMessage"></span>
                    </div>

                    <button type="submit" 
                            :disabled="loading"
                            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/20 transition-all active:scale-[0.98] disabled:opacity-50">
                        <span x-show="!loading">Actualizar Contraseña</span>
                        <span x-show="loading">Guardando...</span>
                    </button>
                </div>
            </form>

            <!-- Success state -->
            <div x-show="successMessage" x-transition x-cloak class="text-center space-y-6">
                <div class="p-4 bg-green-500/10 border border-green-500/30 rounded-xl">
                    <p class="text-green-400 text-sm font-medium" x-text="successMessage"></p>
                </div>
                <a href="/index.html" class="inline-block w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl transition-all shadow-lg shadow-blue-500/20">Iniciar Sesión Ahora</a>
            </div>

        </div>
    </div>

    <script>
    function resetPasswordHandler() {
        return {
            token: '',
            password: '',
            confirmPassword: '',
            loading: false,
            errorMessage: '',
            successMessage: '',
            fatalError: false,

            init() {
                const params = new URLSearchParams(window.location.search);
                const t = params.get('token');
                if (!t) {
                    this.fatalError = true;
                } else {
                    this.token = t;
                }
            },

            async submitForm() {
                if (this.password !== this.confirmPassword) {
                    this.errorMessage = 'Las contraseñas no coinciden.';
                    return;
                }
                if (this.password.length < 8) {
                    this.errorMessage = 'La contraseña debe tener al menos 8 caracteres.';
                    return;
                }

                this.loading = true;
                this.errorMessage = '';

                try {
                    const res = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: this.token, password: this.password })
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok || res.status === 200) {
                        this.successMessage = data.message || 'Contraseña actualizada.';
                    } else {
                        this.errorMessage = data.message || 'El enlace es inválido o expiró.';
                    }
                } catch (e) {
                    this.errorMessage = 'No se pudo conectar con el servidor.';
                } finally {
                    this.loading = false;
                }
            }
        }
    }
    </script>
</body>
</html>
