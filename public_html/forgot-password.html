<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Dataholics Resolve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700" 
         x-data="forgotPasswordHandler()">
        
        <div class="p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">Recuperar Contraseña</h1>
                <p class="text-slate-400 text-sm">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
            </div>

            <!-- Form state -->
            <form x-show="!successMessage" @submit.prevent="submitForm">
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Correo Electrónico</label>
                        <input type="email" x-model="email" required
                               class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none"
                               placeholder="tu@correo.com">
                    </div>

                    <div x-show="errorMessage" x-transition
                         class="p-3 bg-red-500/10 border border-red-500/50 rounded-lg text-red-400 text-sm flex items-start gap-2">
                         <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span x-text="errorMessage"></span>
                    </div>

                    <button type="submit" 
                            :disabled="loading"
                            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/20 transition-all active:scale-[0.98] disabled:opacity-50">
                        <span x-show="!loading">Enviar enlace de recuperación</span>
                        <span x-show="loading">Enviando...</span>
                    </button>
                    
                    <div class="text-center mt-4">
                        <a href="/index.html" class="text-sm text-slate-400 hover:text-white transition-colors">Volver al inicio de sesión</a>
                    </div>
                </div>
            </form>

            <!-- Success state -->
            <div x-show="successMessage" x-transition class="text-center space-y-6">
                <div class="p-4 bg-green-500/10 border border-green-500/30 rounded-xl">
                    <p class="text-green-400 text-sm font-medium" x-text="successMessage"></p>
                </div>
                <a href="/index.html" class="inline-block px-6 py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-medium rounded-lg transition-all">Volver al login</a>
            </div>

        </div>
    </div>

    <script>
    function forgotPasswordHandler() {
        return {
            email: '',
            loading: false,
            errorMessage: '',
            successMessage: '',

            async submitForm() {
                this.loading = true;
                this.errorMessage = '';
                this.successMessage = '';

                try {
                    const res = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: this.email })
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok || res.status === 200) {
                        this.successMessage = data.message || 'Si el correo existe, recibirás un enlace.';
                    } else {
                        this.errorMessage = data.message || 'Ocurrió un error.';
                    }
                } catch (e) {
                    this.errorMessage = 'No se pudo conectar con el servidor.';
                } finally {
                    this.loading = false;
                }
            }
        }
    }
    </script>
</body>
</html>
