<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Base | Dataholics Resolve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #0f172a; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .prose-content p  { margin-bottom: .75rem; line-height: 1.7; color: #cbd5e1; }
        .prose-content h1,.prose-content h2,.prose-content h3 { color: #f1f5f9; font-weight: 600; margin: 1.25rem 0 .5rem; }
        .prose-content h1 { font-size: 1.5rem; }
        .prose-content h2 { font-size: 1.25rem; border-bottom: 1px solid #1e293b; padding-bottom: .35rem; }
        .prose-content h3 { font-size: 1.1rem; }
        .prose-content ul { list-style: disc; padding-left: 1.5rem; margin-bottom: .75rem; color: #cbd5e1; }
        .prose-content ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: .75rem; color: #cbd5e1; }
        .prose-content li { margin-bottom: .25rem; line-height: 1.7; }
        .prose-content code { background: #1e293b; color: #7dd3fc; padding: .15rem .4rem; border-radius: .25rem; font-size: .875rem; font-family: monospace; }
        .prose-content pre { background: #0f172a; border: 1px solid #1e293b; border-radius: .5rem; padding: 1rem; margin-bottom: .75rem; overflow-x: auto; }
        .prose-content pre code { background: none; padding: 0; color: #94a3b8; }
        .prose-content strong { color: #f1f5f9; font-weight: 600; }
        .prose-content hr { border-color: #1e293b; margin: 1.25rem 0; }
        .prose-content ul,.prose-content ol { margin-left: 1.25rem; margin-bottom: .75rem; color: #cbd5e1; }
        .prose-content ul { list-style: disc; }
        .prose-content ol { list-style: decimal; }
        .prose-content li { margin-bottom: .25rem; }
        .prose-content code { background: #1e293b; color: #7dd3fc; padding: 2px 6px; border-radius: 4px; font-size: .85em; }
        .prose-content pre  { background: #0f172a; border: 1px solid #334155; padding: 1rem; border-radius: 8px; overflow-x: auto; margin-bottom: .75rem; }
        .prose-content pre code { background: none; padding: 0; color: #e2e8f0; }
        .prose-content blockquote { border-left: 3px solid #3b82f6; padding-left: .875rem; color: #94a3b8; margin: .75rem 0; }
        .prose-content a { color: #60a5fa; text-decoration: underline; }
        .prose-content hr { border-color: #334155; margin: 1.25rem 0; }
        .prose-content strong { color: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100" x-cloak x-data="kbApp()" x-init="init()">

    <!-- Spinner de carga inicial -->
    <div x-show="!user" class="flex h-screen items-center justify-center">
        <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div x-show="user" class="flex h-screen overflow-hidden">

        <!-- ═══ SIDEBAR ═══ -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0">
            <!-- Brand + user -->
            <div class="p-5 border-b border-slate-800">
                <h1 class="text-lg font-bold text-white">Dataholics <span class="text-blue-500">Resolve</span></h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="w-2 h-2 bg-green-400 rounded-full"></span>
                    <p class="text-xs text-slate-400 truncate" x-text="user?.name"></p>
                </div>
            </div>

            <!-- Category search (shows when there are enough categories) -->
            <div x-show="categories.length >= 5" class="px-3 pt-3 pb-1">
                <div class="relative">
                    <svg class="w-3.5 h-3.5 text-slate-500 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
                    </svg>
                    <input type="text"
                           x-model="categorySearch"
                           placeholder="Filtrar categorías…"
                           class="w-full bg-slate-800 border border-slate-700/50 text-slate-300 placeholder-slate-600 text-xs pl-7 pr-3 py-2 rounded-lg focus:ring-1 focus:ring-blue-500 outline-none transition-all">
                </div>
            </div>

            <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto scrollbar-thin">

                <!-- All articles -->
                <div class="pb-1 px-1 mb-1">
                    <p class="text-xs text-slate-600 font-medium uppercase tracking-wider mb-1.5">Biblioteca</p>
                    <button @click="activeCategory = null; activeArticle = null; categorySearch = ''"
                            :class="activeCategory === null && !activeArticle
                                ? 'bg-blue-600/20 text-blue-300 border-l-2 border-blue-500 pl-2.5'
                                : 'text-slate-400 hover:bg-slate-800 hover:text-white border-l-2 border-transparent pl-2.5'"
                            class="w-full flex items-center gap-2.5 pr-3 py-2 rounded-r-lg text-sm font-medium transition-all text-left">
                        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                        </svg>
                        <span class="truncate">Todos los artículos</span>
                        <span class="ml-auto text-xs font-semibold"
                              :class="activeCategory === null && !activeArticle ? 'text-blue-400' : 'text-slate-500'"
                              x-text="articles.length"></span>
                    </button>
                </div>

                <!-- Categories section -->
                <template x-if="categories.length > 0">
                    <div>
                        <div class="flex items-center justify-between px-1 pt-2 pb-1.5">
                            <p class="text-xs text-slate-600 font-medium uppercase tracking-wider">Categorías</p>
                            <span class="text-xs text-slate-600" x-text="categories.length"></span>
                        </div>

                        <template x-for="cat in filteredCategories" :key="cat">
                            <button @click="setCategory(cat)"
                                    :class="activeCategory === cat
                                        ? 'bg-slate-700/60 text-white border-l-2 border-blue-400 pl-2.5'
                                        : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200 border-l-2 border-transparent pl-2.5'"
                                    class="w-full flex items-center gap-2.5 pr-3 py-2 rounded-r-lg text-sm transition-all text-left group">
                                <!-- Colored dot per category -->
                                <span class="w-2 h-2 rounded-full shrink-0 transition-colors"
                                      :class="activeCategory === cat ? 'bg-blue-400' : 'bg-slate-600 group-hover:bg-slate-400'"></span>
                                <span x-text="cat" class="truncate flex-1"></span>
                                <span class="ml-auto text-xs font-medium shrink-0"
                                      :class="activeCategory === cat ? 'text-blue-300' : 'text-slate-600 group-hover:text-slate-400'"
                                      x-text="categoryCount(cat)"></span>
                            </button>
                        </template>

                        <!-- No results for category search -->
                        <div x-show="filteredCategories.length === 0 && categorySearch.trim()"
                             class="px-3 py-3 text-xs text-slate-600 text-center">
                            Sin resultados para "<span x-text="categorySearch"></span>"
                        </div>
                    </div>
                </template>

                <!-- Loading skeleton -->
                <template x-if="categories.length === 0 && loading">
                    <div class="space-y-1 px-1 pt-2">
                        <div class="h-3 bg-slate-800 rounded w-16 mb-2"></div>
                        <div class="h-7 bg-slate-800/60 rounded-r-lg border-l-2 border-transparent"></div>
                        <div class="h-7 bg-slate-800/60 rounded-r-lg border-l-2 border-transparent"></div>
                        <div class="h-7 bg-slate-800/60 rounded-r-lg border-l-2 border-transparent"></div>
                    </div>
                </template>

                <!-- Navigation links -->
                <div class="pt-4 pb-1 px-1 mt-2 border-t border-slate-800/60">
                    <p class="text-xs text-slate-600 font-medium uppercase tracking-wider mb-1.5">Navegación</p>
                </div>
                <a href="/servicedesk.html"
                   class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-white transition-all">
                    <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    Tickets
                </a>
                <template x-if="user?.role === 'admin'">
                    <div class="space-y-0.5">
                        <a href="/agentes.html"
                           class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-white transition-all">
                            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                            </svg>
                            Agentes
                        </a>
                        <a href="/admin.html"
                           class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-white transition-all">
                            <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            Panel Admin
                        </a>
                    </div>
                </template>
            </nav>

            <div class="p-3 border-t border-slate-800">
                <button @click="logout()" class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm text-slate-400 hover:bg-red-500/10 hover:text-red-400 transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- ═══ MAIN ═══ -->
        <div class="flex-1 overflow-hidden flex flex-col">

            <!-- Header -->
            <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center gap-4 shrink-0">
                <div class="flex-1">
                    <h2 class="font-semibold text-white">
                        <span x-show="!activeArticle">
                            <span x-show="!activeCategory">Knowledge Base</span>
                            <span x-show="activeCategory" x-text="activeCategory"></span>
                        </span>
                        <span x-show="activeArticle">
                            <button @click="activeArticle = null" class="text-blue-400 hover:text-blue-300 mr-2 text-sm">← Volver</button>
                            <span x-text="activeArticle?.title"></span>
                        </span>
                    </h2>
                    <p x-show="!activeArticle" class="text-xs text-slate-500 mt-0.5" x-text="`${filteredArticles.length} artículo(s)`"></p>
                    <p x-show="activeArticle" class="text-xs text-slate-500 mt-0.5">
                        <span x-text="activeArticle?.category || 'Sin categoría'"></span>
                        · por <span x-text="activeArticle?.author_name || 'Desconocido'"></span>
                        · <span x-text="formatDate(activeArticle?.created_at)"></span>
                    </p>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Barra de búsqueda (solo en lista) -->
                    <template x-if="!activeArticle">
                        <div class="relative">
                            <svg class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
                            </svg>
                            <input type="text" x-model="searchQuery" placeholder="Buscar artículo..."
                                   class="bg-slate-800 border border-slate-700 text-white placeholder-slate-500 pl-9 pr-4 py-2 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all w-52">
                        </div>
                    </template>

                    <!-- Botón nuevo artículo (admin / servicedesk) -->
                    <template x-if="canWrite && !activeArticle">
                        <button @click="openEditor(null)"
                                class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-all shadow-lg shadow-blue-500/20">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                            </svg>
                            Nuevo artículo
                        </button>
                    </template>

                    <!-- Botón editar en detalle (admin / servicedesk) -->
                    <template x-if="canWrite && activeArticle">
                        <div class="flex items-center gap-2">
                            <button @click="openEditor(activeArticle)"
                                    class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-white text-sm px-3 py-2 rounded-lg transition-all">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                                Editar
                            </button>
                            <template x-if="user?.role === 'admin'">
                                <button @click="confirmDelete(activeArticle)"
                                        class="flex items-center gap-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-sm px-3 py-2 rounded-lg transition-all">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                    </svg>
                                    Eliminar
                                </button>
                            </template>
                        </div>
                    </template>
                </div>
            </header>

            <!-- ═══ LISTA DE ARTÍCULOS ═══ -->
            <div x-show="!activeArticle" class="flex-1 overflow-y-auto scrollbar-thin p-6">

                <!-- Estado vacío -->
                <div x-show="filteredArticles.length === 0 && !loading"
                     class="flex flex-col items-center justify-center h-64 text-slate-600">
                    <svg class="w-12 h-12 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    <p class="text-sm" x-text="searchQuery ? 'No hay resultados para tu búsqueda' : 'Aún no hay artículos publicados'"></p>
                    <template x-if="canWrite && !searchQuery">
                        <button @click="openEditor(null)" class="mt-3 text-sm text-blue-400 hover:text-blue-300 transition-colors">
                            + Crear el primero
                        </button>
                    </template>
                </div>

                <!-- Grid de artículos -->
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                    <template x-for="article in filteredArticles" :key="article.id">
                        <div @click="loadArticle(article.id)"
                             class="bg-slate-900 border border-slate-800 hover:border-slate-600 rounded-xl p-5 cursor-pointer transition-all hover:shadow-xl hover:shadow-slate-900/50 group">
                            <div class="flex items-start justify-between gap-3 mb-3">
                                <div class="flex-1 min-w-0">
                                    <p x-text="article.category || 'General'"
                                       class="text-xs font-medium text-blue-400 uppercase tracking-wide mb-1.5 truncate"></p>
                                    <h3 x-text="article.title"
                                        class="font-semibold text-white group-hover:text-blue-300 transition-colors line-clamp-2"></h3>
                                </div>
                                <template x-if="article.status === 'draft'">
                                    <span class="shrink-0 text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-full">
                                        Borrador
                                    </span>
                                </template>
                            </div>
                            <div class="flex items-center justify-between text-xs text-slate-500">
                                <span x-text="article.author_name || 'Equipo Dataholics'"></span>
                                <span x-text="formatDate(article.created_at)"></span>
                            </div>
                        </div>
                    </template>
                </div>


            </div>

            <!-- ═══ DETALLE DE ARTÍCULO ═══ -->
            <div x-show="activeArticle" class="flex-1 overflow-y-auto scrollbar-thin">
                <div class="max-w-3xl mx-auto px-6 py-8">
                    <template x-if="activeArticle">
                        <div>
                            <!-- Cabecera artículo -->
                            <div class="mb-8">
                                <div class="flex items-center gap-2 mb-3">
                                    <span x-text="activeArticle.category || 'General'"
                                          class="text-xs font-medium text-blue-400 uppercase tracking-wide"></span>
                                    <template x-if="activeArticle.status === 'draft'">
                                        <span class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-full">
                                            Borrador
                                        </span>
                                    </template>
                                </div>
                                <h1 class="text-2xl font-bold text-white mb-4" x-text="activeArticle.title"></h1>
                                <div class="flex items-center gap-4 text-sm text-slate-500 pb-6 border-b border-slate-800">
                                    <span class="flex items-center gap-1.5">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                        </svg>
                                        <span x-text="activeArticle.author_name || 'Equipo Dataholics'"></span>
                                    </span>
                                    <span class="flex items-center gap-1.5">
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                        </svg>
                                        <span x-text="formatDate(activeArticle.created_at)"></span>
                                    </span>
                                    <template x-if="activeArticle.updated_at !== activeArticle.created_at">
                                        <span class="text-slate-600">Actualizado: <span x-text="formatDate(activeArticle.updated_at)"></span></span>
                                    </template>
                                </div>
                            </div>

                            <!-- Contenido -->
                            <div class="prose-content" x-html="renderContent(activeArticle.content)"></div>
                        </div>
                    </template>
                </div>
            </div>

        </div>
    </div>

    <!-- ═══ MODAL EDITOR ═══ -->
    <div x-show="showEditor"
         class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4"
         @click.self="showEditor = false">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col"
             @click.stop>
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 shrink-0">
                <h3 class="text-lg font-semibold text-white" x-text="editingArticle?.id ? 'Editar artículo' : 'Nuevo artículo'"></h3>
                <button @click="showEditor = false" class="text-slate-500 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto scrollbar-thin p-6 space-y-4">
                <!-- Título -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Título <span class="text-red-400">*</span></label>
                    <input type="text" x-model="form.title" placeholder="Título del artículo"
                           class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm">
                </div>

                <!-- Categoría + Estado en fila -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5">Categoría</label>
                        <input type="text" x-model="form.category" placeholder="ej. Onboarding, Facturación…"
                               class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm"
                               list="kb-categories">
                        <datalist id="kb-categories">
                            <template x-for="cat in categories" :key="cat">
                                <option :value="cat"></option>
                            </template>
                        </datalist>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5">Estado</label>
                        <select x-model="form.status"
                                class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm">
                            <option value="draft">Borrador</option>
                            <option value="published">Publicado</option>
                        </select>
                    </div>
                </div>

                <!-- Contenido -->
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">
                        Contenido <span class="text-red-400">*</span>
                        <span class="ml-2 text-xs text-slate-500 font-normal">Soporta HTML básico: &lt;b&gt;, &lt;i&gt;, &lt;ul&gt;, &lt;pre&gt;, &lt;blockquote&gt;, etc.</span>
                    </label>
                    <textarea x-model="form.content" rows="14" placeholder="Escribe el contenido del artículo…"
                              class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm font-mono resize-none"></textarea>
                </div>

                <!-- Error -->
                <div x-show="formError" class="p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm" x-text="formError"></div>
            </div>

            <div class="px-6 py-4 border-t border-slate-800 flex justify-end gap-3 shrink-0">
                <button @click="showEditor = false"
                        class="px-4 py-2 text-sm text-slate-400 hover:text-white transition-colors">
                    Cancelar
                </button>
                <button @click="saveArticle()"
                        :disabled="saving"
                        class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-all disabled:opacity-50 shadow-lg shadow-blue-500/20">
                    <span x-show="!saving" x-text="editingArticle?.id ? 'Guardar cambios' : 'Crear artículo'"></span>
                    <span x-show="saving">Guardando…</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ═══ MODAL CONFIRMAR ELIMINAR ═══ -->
    <div x-show="showDeleteConfirm"
         class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4"
         @click.self="showDeleteConfirm = false">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-sm p-6" @click.stop>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-red-500/10 rounded-full flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <div>
                    <h3 class="font-semibold text-white">Eliminar artículo</h3>
                    <p class="text-sm text-slate-400 mt-0.5">Esta acción no se puede deshacer.</p>
                </div>
            </div>
            <p class="text-sm text-slate-300 mb-6">
                ¿Estás seguro de que deseas eliminar
                <span class="font-medium text-white" x-text="`"${articleToDelete?.title}"`"></span>?
            </p>
            <div class="flex gap-3 justify-end">
                <button @click="showDeleteConfirm = false"
                        class="px-4 py-2 text-sm text-slate-400 hover:text-white transition-colors">
                    Cancelar
                </button>
                <button @click="deleteArticle()"
                        :disabled="deleting"
                        class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-sm font-medium rounded-lg transition-all disabled:opacity-50">
                    <span x-show="!deleting">Eliminar</span>
                    <span x-show="deleting">Eliminando…</span>
                </button>
            </div>
        </div>
    </div>

    <script>
    function kbApp() {
        return {
            user:               null,
            articles:           [],
            categories:         [],
            activeCategory:     null,
            activeArticle:      null,
            searchQuery:        '',
            categorySearch:     '',
            loading:            false,

            // Editor
            showEditor:         false,
            editingArticle:     null,
            form:               { title: '', category: '', content: '', status: 'draft' },
            formError:          '',
            saving:             false,

            // Eliminar
            showDeleteConfirm:  false,
            articleToDelete:    null,
            deleting:           false,

            get canWrite() {
                return ['admin', 'servicedesk'].includes(this.user?.role);
            },

            setCategory(category) {
                this.activeCategory = category;
                this.activeArticle = null;
            },

            categoryCount(category) {
                return this.articles.filter(a => a.category === category).length;
            },

            get filteredCategories() {
                if (!this.categorySearch.trim()) return this.categories;
                const q = this.categorySearch.toLowerCase();
                return this.categories.filter(c => c.toLowerCase().includes(q));
            },

            get filteredArticles() {
                let list = this.articles;
                if (this.activeCategory) {
                    list = list.filter(a => a.category === this.activeCategory);
                }
                if (this.searchQuery.trim()) {
                    const q = this.searchQuery.toLowerCase();
                    list = list.filter(a =>
                        a.title.toLowerCase().includes(q) ||
                        (a.category || '').toLowerCase().includes(q)
                    );
                }
                return list;
            },

            async init() {
                try {
                    const r = await fetch('/api/auth/me');
                    if (!r.ok) { window.location.href = '/index.html'; return; }
                    this.user = await r.json();

                    if (!this.user.is_internal) {
                        window.location.href = '/index.html';
                        return;
                    }

                    await Promise.all([this.loadArticles(), this.loadCategories()]);
                } catch {
                    window.location.href = '/index.html';
                }
            },

            async loadArticles() {
                this.loading = true;
                try {
                    const r = await fetch('/api/kb');
                    if (r.ok) this.articles = await r.json();
                } finally {
                    this.loading = false;
                }
            },

            async loadCategories() {
                const r = await fetch('/api/kb/categories');
                if (r.ok) this.categories = await r.json();
            },

            async loadArticle(id) {
                const r = await fetch(`/api/kb/${id}`);
                if (r.ok) this.activeArticle = await r.json();
            },

            openEditor(article) {
                this.editingArticle = article;
                this.formError      = '';
                this.form = article
                    ? { title: article.title, category: article.category || '', content: article.content, status: article.status }
                    : { title: '', category: '', content: '', status: 'draft' };
                this.showEditor = true;
            },

            async saveArticle() {
                this.formError = '';
                if (!this.form.title.trim())   { this.formError = 'El título es obligatorio';    return; }
                if (!this.form.content.trim()) { this.formError = 'El contenido es obligatorio'; return; }

                this.saving = true;
                try {
                    const isEdit = !!this.editingArticle?.id;
                    const url    = isEdit ? `/api/kb/${this.editingArticle.id}` : '/api/kb';
                    const method = isEdit ? 'PUT' : 'POST';

                    const r = await fetch(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.form),
                    });

                    const data = await r.json();
                    if (!r.ok) {
                        this.formError = data.messages?.error || data.message || 'Error al guardar';
                        return;
                    }

                    this.showEditor = false;
                    await Promise.all([this.loadArticles(), this.loadCategories()]);

                    if (isEdit && this.activeArticle?.id === this.editingArticle.id) {
                        await this.loadArticle(this.editingArticle.id);
                    }
                } catch {
                    this.formError = 'No se pudo conectar con el servidor';
                } finally {
                    this.saving = false;
                }
            },

            confirmDelete(article) {
                this.articleToDelete    = article;
                this.showDeleteConfirm  = true;
            },

            async deleteArticle() {
                this.deleting = true;
                try {
                    const r = await fetch(`/api/kb/${this.articleToDelete.id}`, { method: 'DELETE' });
                    if (r.ok) {
                        this.showDeleteConfirm = false;
                        this.activeArticle     = null;
                        await Promise.all([this.loadArticles(), this.loadCategories()]);
                    }
                } finally {
                    this.deleting = false;
                }
            },

            renderContent(text) {
                if (!text) return '';
                const html = marked.parse(text);
                // Eliminar scripts para prevenir XSS
                return html.replace(/<script[\s\S]*?<\/script>/gi, '');
            },

            formatDate(dateStr) {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return d.toLocaleDateString('es-MX', { year: 'numeric', month: 'short', day: 'numeric' });
            },

            async logout() {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/index.html';
            },
        };
    }
    </script>
</body>
</html>
