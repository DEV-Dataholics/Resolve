<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desarrollo: Agentes | Dataholics Resolve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #0f172a; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .prose-content p  { margin-bottom: .75rem; line-height: 1.7; color: #cbd5e1; }
        .prose-content h1,.prose-content h2,.prose-content h3 { color: #f1f5f9; font-weight: 600; margin: 1.25rem 0 .5rem; }
        .prose-content h1 { font-size: 1.5rem; }
        .prose-content h2 { font-size: 1.25rem; border-bottom: 1px solid #1e293b; padding-bottom: .35rem; }
        .prose-content h3 { font-size: 1.1rem; }
        .prose-content ul { list-style: disc; padding-left: 1.5rem; margin-bottom: .75rem; color: #cbd5e1; }
        .prose-content ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: .75rem; color: #cbd5e1; }
        .prose-content li { margin-bottom: .25rem; line-height: 1.7; }
        .prose-content code { background: #1e293b; color: #7dd3fc; padding: .15rem .4rem; border-radius: .25rem; font-size: .875rem; font-family: monospace; }
        .prose-content pre { background: #0f172a; border: 1px solid #1e293b; border-radius: .5rem; padding: 1rem; margin-bottom: .75rem; overflow-x: auto; }
        .prose-content pre code { background: none; padding: 0; color: #94a3b8; }
        .prose-content blockquote { border-left: 3px solid #3b82f6; padding-left: .875rem; color: #94a3b8; margin: .75rem 0; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100" x-cloak x-data="agentsApp()" x-init="init()">

    <!-- Spinner de carga inicial -->
    <div x-show="!user" class="flex h-screen items-center justify-center">
        <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div x-show="user" class="flex h-screen overflow-hidden">

        <!-- ═══ SIDEBAR ═══ -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0">
            <div class="p-5 border-b border-slate-800">
                <h1 class="text-lg font-bold text-white">Dataholics <span class="text-blue-500">Resolve</span></h1>
                <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Agentes de Desarrollo</p>
            </div>

            <nav class="flex-1 p-3 space-y-1 overflow-y-auto scrollbar-thin">
                <template x-for="agent in agents" :key="agent.id">
                    <button @click="activeAgent = agent"
                            :class="activeAgent?.id === agent.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all text-left">
                        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span x-text="agent.title" class="truncate"></span>
                    </button>
                </template>

                <div class="pt-6 pb-1 px-3 mt-auto">
                    <p class="text-xs text-slate-600 font-medium uppercase tracking-wider">Navegación</p>
                </div>
                <a href="/servicedesk.html"
                   class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-white transition-all">
                    <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    Tickets
                </a>
                <a href="/kb.html"
                   class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-800 hover:text-white transition-all">
                    <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                    Knowledge Base
                </a>
            </nav>

            <div class="p-3 border-t border-slate-800">
                <button @click="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-400 hover:bg-red-500/10 hover:text-red-400 transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- ═══ MAIN ═══ -->
        <main class="flex-1 overflow-hidden flex flex-col">
            <!-- Header -->
            <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between shrink-0">
                <div>
                    <h2 class="font-semibold text-white" x-text="activeAgent ? activeAgent.title : 'Selecciona un agente'"></h2>
                    <p class="text-xs text-slate-500 mt-0.5" x-text="activeAgent ? `Archivo: ${activeAgent.filename}` : 'Definiciones del folder /agentes'"></p>
                </div>
            </header>

            <!-- Content -->
            <div class="flex-1 overflow-y-auto p-8 scrollbar-thin">
                <template x-if="!activeAgent">
                    <div class="h-full flex flex-col items-center justify-center text-slate-500">
                        <svg class="w-16 h-16 mb-4 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                        <p class="text-lg font-medium">Dataholics Agent Ecosystem</p>
                        <p class="text-sm">Selecciona un agente en el menú lateral para ver su definición completa.</p>
                    </div>
                </template>

                <template x-if="activeAgent">
                    <div class="max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                        <div class="prose-content" x-html="renderMarkdown(activeAgent.content)"></div>
                    </div>
                </template>
            </div>
        </main>
    </div>

    <script>
    function agentsApp() {
        return {
            user: null,
            agents: [],
            activeAgent: null,

            async init() {
                try {
                    const r = await fetch('/api/auth/me');
                    if (!r.ok) { window.location.href = '/index.html'; return; }
                    this.user = await r.json();

                    if (this.user.role !== 'admin') {
                        window.location.href = '/servicedesk.html';
                        return;
                    }

                    await this.loadAgents();
                } catch {
                    window.location.href = '/index.html';
                }
            },

            async loadAgents() {
                try {
                    const r = await fetch('/api/admin/agents');
                    if (r.ok) {
                        this.agents = await r.json();
                        // Seleccionar el primero por defecto si existe
                        if (this.agents.length > 0) this.activeAgent = this.agents[0];
                    }
                } catch (e) {
                    console.error('Error loading agents:', e);
                }
            },

            renderMarkdown(text) {
                if (!text) return '';
                // Limpiar frontmatter si existe (--- ... ---)
                const cleanText = text.replace(/^---[\s\S]*?---\s*/, '');
                return marked.parse(cleanText);
            },

            async logout() {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/index.html';
            }
        }
    }
    </script>
</body>
</html>
