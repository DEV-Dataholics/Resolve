<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portal | Dataholics Resolve</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { 50:'#eff6ff', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8', 900:'#1e3a8a' }
            }
          }
        }
      }
    </script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #1e293b; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100" x-cloak x-data="clientDashboard()" x-init="init()">

    <!-- Auth Guard -->
    <div x-show="!user" class="flex h-screen items-center justify-center">
        <div class="text-center space-y-3">
            <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <p class="text-slate-400 text-sm">Verificando sesión...</p>
        </div>
    </div>

    <!-- Main App -->
    <div x-show="user" class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0">
            <div class="p-5 border-b border-slate-800">
                <template x-if="!user?.logo_url">
                    <h1 class="text-lg font-bold text-white">Portal <span :style="user?.brand_color ? 'color: ' + user.brand_color : 'color: #3b82f6'">Soporte</span></h1>
                </template>
                <template x-if="user?.logo_url">
                    <img :src="user.logo_url" alt="Logo" class="max-h-12 w-auto object-contain">
                </template>
                <p class="text-xs text-slate-500 mt-2" x-text="user?.name"></p>
            </div>

            <nav class="flex-1 p-3 space-y-1">
                <button @click="activeView = 'tickets'"
                        :style="activeView === 'tickets' && user?.brand_color ? 'background-color: ' + user.brand_color + '; color: white;' : ''"
                        :class="activeView === 'tickets' ? (user?.brand_color ? 'text-white' : 'bg-blue-600 text-white') : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    Mis Tickets
                </button>
                <button @click="openNewTicketModal()"
                        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Nuevo Ticket
                </button>
            </nav>

            <div class="p-3 border-t border-slate-800">
                <button @click="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-400 hover:bg-red-500/10 hover:text-red-400 transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-hidden flex flex-col">

            <!-- Header -->
            <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between shrink-0">
                <div>
                    <h2 class="font-semibold text-white" x-text="activeView === 'tickets' ? 'Mis Tickets' : 'Detalle del Ticket'"></h2>
                    <p class="text-xs text-slate-500 mt-0.5" x-show="activeView === 'tickets'" x-text="`${tickets.length} ticket(s) activos`"></p>
                </div>
                <button @click="openNewTicketModal()"
                        class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-all shadow shadow-blue-500/20">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Nuevo Ticket
                </button>
            </header>

            <!-- Ticket List View -->
            <div x-show="activeView === 'tickets'" class="flex-1 overflow-y-auto p-6 space-y-3 scrollbar-thin">

                <!-- Loading -->
                <div x-show="loadingTickets" class="text-center py-20 text-slate-500">
                    <div class="w-8 h-8 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                    Cargando tickets...
                </div>

                <!-- Empty State -->
                <div x-show="!loadingTickets && tickets.length === 0" class="text-center py-20">
                    <div class="w-16 h-16 bg-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    </div>
                    <p class="text-slate-400 font-medium">No tienes tickets abiertos</p>
                    <p class="text-slate-600 text-sm mt-1">Crea uno si necesitas ayuda</p>
                    <button @click="openNewTicketModal()" 
                            :style="user?.brand_color ? 'background-color: ' + user.brand_color : ''"
                            :class="user?.brand_color ? 'mt-4 hover:brightness-110 text-white text-sm px-5 py-2 rounded-lg transition-all' : 'mt-4 bg-blue-600 hover:bg-blue-500 text-white text-sm px-5 py-2 rounded-lg transition-all'">
                        Reportar un problema
                    </button>
                </div>

                <!-- Tickets List -->
                <template x-for="ticket in tickets" :key="ticket.id">
                    <div @click="openTicketDetail(ticket)"
                         class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-5 cursor-pointer transition-all hover:shadow-lg group">
                        <div class="flex items-start justify-between gap-4">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs text-slate-500 font-mono" x-text="`#${ticket.id}`"></span>
                                    <span :class="priorityBadge(ticket.priority)" class="text-xs font-medium px-2 py-0.5 rounded-full" x-text="priorityLabel(ticket.priority)"></span>
                                </div>
                                <h3 class="font-medium text-white truncate group-hover:text-blue-400 transition-colors" x-text="ticket.title"></h3>
                                <p class="text-sm text-slate-500 mt-1 line-clamp-1" x-text="ticket.description"></p>
                            </div>
                            <div class="shrink-0">
                                <span :class="statusBadge(ticket.status)" class="text-xs font-medium px-2.5 py-1 rounded-full" x-text="statusLabel(ticket.status)"></span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 mt-3 pt-3 border-t border-slate-800 text-xs text-slate-600">
                            <span x-text="`Creado: ${formatDate(ticket.created_at)}`"></span>
                            <template x-if="ticket.updated_at !== ticket.created_at">
                                <span x-text="`· Actualizado: ${formatDate(ticket.updated_at)}`"></span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Ticket Detail View -->
            <div x-show="activeView === 'detail' && selectedTicket" class="flex-1 overflow-hidden flex flex-col">
                <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                    <button @click="activeView = 'tickets'" class="text-slate-400 hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <div class="flex-1">
                        <h3 class="font-semibold text-white" x-text="selectedTicket?.title"></h3>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-xs text-slate-500 font-mono" x-text="`#${selectedTicket?.id}`"></span>
                            <span :class="statusBadge(selectedTicket?.status)" class="text-xs font-medium px-2 py-0.5 rounded-full" x-text="statusLabel(selectedTicket?.status)"></span>
                            <span :class="priorityBadge(selectedTicket?.priority)" class="text-xs font-medium px-2 py-0.5 rounded-full" x-text="priorityLabel(selectedTicket?.priority)"></span>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div class="p-6 border-b border-slate-800 bg-slate-900/50">
                    <p class="text-sm text-slate-300 leading-relaxed" x-text="selectedTicket?.description"></p>
                </div>

                <!-- Chat Thread -->
                <div class="flex-1 overflow-y-auto p-6 space-y-4 scrollbar-thin" id="chat-container">
                    <template x-for="comment in comments" :key="comment.id">
                        <div :class="comment.author_id === user?.id ? 'flex-row-reverse' : 'flex-row'" class="flex items-end gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold text-white shrink-0" x-text="comment.author_name?.[0] ?? '?'"></div>
                            <div :class="comment.author_id === user?.id ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-200'"
                                 class="max-w-md px-4 py-3 rounded-2xl text-sm leading-relaxed">
                                <p x-text="comment.text"></p>
                                <p :class="comment.author_id === user?.id ? 'text-blue-200' : 'text-slate-500'"
                                   class="text-xs mt-1" x-text="formatDate(comment.created_at)"></p>
                            </div>
                        </div>
                    </template>
                    <div x-show="comments.length === 0" class="text-center text-slate-600 text-sm py-4">
                        No hay mensajes aún. Sé el primero en escribir.
                    </div>
                </div>

                <!-- Reply Box -->
                <div class="p-4 border-t border-slate-800 bg-slate-900" x-show="selectedTicket?.status !== 'closed'">
                    <form @submit.prevent="submitComment()" class="flex gap-3">
                        <input type="text" x-model="newComment" placeholder="Escribe tu mensaje..."
                               class="flex-1 bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                        <button type="submit" :disabled="!newComment.trim()"
                                class="bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition-all">
                            Enviar
                        </button>
                    </form>
                </div>
                <div x-show="selectedTicket?.status === 'closed'" class="p-4 border-t border-slate-800 text-center text-sm text-slate-500">
                    Este ticket está cerrado.
                </div>
            </div>
        </main>
    </div>

    <!-- New Ticket Modal -->
    <div x-show="showModal" x-transition:enter="ease-out duration-200" x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100" x-transition:leave="opacity-100" x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
         @click.self="showModal = false">
        <div x-transition:enter="ease-out duration-200" x-transition:enter-start="scale-95 opacity-0"
             x-transition:enter-end="scale-100 opacity-100"
             class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg shadow-2xl">
            <div class="flex items-center justify-between p-6 border-b border-slate-800">
                <h3 class="font-semibold text-white">Nuevo Ticket de Soporte</h3>
                <button @click="showModal = false" class="text-slate-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form @submit.prevent="submitTicket()" class="p-6 space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Asunto <span class="text-red-400">*</span></label>
                    <input type="text" x-model="newTicket.title" required minlength="5"
                           class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                           placeholder="Describe brevemente el problema">
                    <p class="text-xs text-slate-500 mt-1">Mínimo 5 caracteres.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Descripción detallada <span class="text-red-400">*</span></label>
                    <textarea x-model="newTicket.description" required rows="4"
                              class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all resize-none"
                              placeholder="Incluye pasos para reproducir el error, capturas, etc."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Prioridad</label>
                    <select x-model="newTicket.priority"
                            class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <option value="low">Baja</option>
                        <option value="medium" selected>Media</option>
                        <option value="high">Alta</option>
                        <option value="critical">Crítica</option>
                    </select>
                </div>
                <div x-show="formError" class="p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm" x-text="formError"></div>
                <div class="flex gap-3 pt-2">
                    <button type="button" @click="showModal = false" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-medium transition-all">Cancelar</button>
                    <button type="submit" :disabled="submittingTicket" class="flex-1 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white py-2.5 rounded-xl text-sm font-medium transition-all">
                        <span x-show="!submittingTicket">Crear Ticket</span>
                        <span x-show="submittingTicket">Enviando...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
    const API = '/api';

    function clientDashboard() {
        return {
            user: null,
            tickets: [],
            selectedTicket: null,
            comments: [],
            activeView: 'tickets',
            loadingTickets: false,
            showModal: false,
            newComment: '',
            formError: '',
            submittingTicket: false,
            newTicket: { title: '', description: '', priority: 'medium' },

            async init() {
                try {
                    const res = await fetch(`${API}/auth/me`);
                    if (!res.ok) { window.location.href = '/index.html'; return; }
                    this.user = await res.json();
                    if (this.user.role !== 'client') { window.location.href = '/servicedesk.html'; return; }
                    await this.loadTickets();
                } catch (e) {
                    window.location.href = '/index.html';
                }
            },

            async loadTickets() {
                this.loadingTickets = true;
                try {
                    const res = await fetch(`${API}/tickets?_t=${Date.now()}`);
                    this.tickets = res.ok ? await res.json() : [];
                } finally {
                    this.loadingTickets = false;
                }
            },

            async openTicketDetail(ticket) {
                this.selectedTicket = ticket;
                this.activeView = 'detail';
                this.comments = [];
                try {
                    const res = await fetch(`${API}/tickets/${ticket.id}?_t=${Date.now()}`);
                    if (res.ok) {
                        const data = await res.json();
                        this.comments = data.comments || [];
                    }
                } catch(e) {}
                this.$nextTick(() => {
                    const el = document.getElementById('chat-container');
                    if (el) el.scrollTop = el.scrollHeight;
                });
            },

            async submitComment() {
                if (!this.newComment.trim()) return;
                try {
                    const res = await fetch(`${API}/tickets/${this.selectedTicket.id}/comment`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ text: this.newComment })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        this.newComment = '';
                        if (data.comment) {
                            this.comments.push(data.comment);
                            this.$nextTick(() => {
                                const el = document.getElementById('chat-container');
                                if (el) el.scrollTop = el.scrollHeight;
                            });
                        } else {
                            await this.openTicketDetail(this.selectedTicket);
                        }
                    }
                } catch(e) {}
            },

            openNewTicketModal() {
                this.newTicket = { title: '', description: '', priority: 'medium' };
                this.formError = '';
                this.showModal = true;
            },

            async submitTicket() {
                this.formError = '';
                this.submittingTicket = true;
                try {
                    const res = await fetch(`${API}/tickets`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(this.newTicket)
                    });
                    const data = await res.json();
                    if (res.ok) {
                        this.showModal = false;
                        await this.loadTickets();
                    } else {
                        const detail = data?.messages?.title || data?.messages?.description || data?.messages?.priority || data?.messages?.error || data?.message;
                        this.formError = detail || 'Error al crear el ticket';
                    }
                } catch(e) {
                    this.formError = 'No se pudo conectar con el servidor';
                } finally {
                    this.submittingTicket = false;
                }
            },

            async logout() {
                await fetch(`${API}/auth/logout`, { method: 'POST' });
                localStorage.clear();
                window.location.href = '/index.html';
            },

            priorityBadge(p) {
                return { low:'bg-slate-700 text-slate-300', medium:'bg-yellow-500/20 text-yellow-400', high:'bg-orange-500/20 text-orange-400', critical:'bg-red-500/20 text-red-400' }[p] || '';
            },
            priorityLabel(p) {
                return { low:'Baja', medium:'Media', high:'Alta', critical:'Crítica' }[p] || p;
            },
            statusBadge(s) {
                return { new:'bg-blue-500/20 text-blue-400', in_progress:'bg-purple-500/20 text-purple-400', resolved:'bg-green-500/20 text-green-400', closed:'bg-slate-700 text-slate-400' }[s] || '';
            },
            statusLabel(s) {
                return { new:'Nuevo', in_progress:'En Progreso', resolved:'Resuelto', closed:'Cerrado' }[s] || s;
            },
            formatDate(d) {
                if (!d) return '';
                return new Date(d).toLocaleString('es-MX', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
            }
        }
    }
    </script>
</body>
</html>
